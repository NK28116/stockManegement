<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management UI</title>
    <!-- Tailwind CSS for basic styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    {% raw %}
    <div id="app" class="container mx-auto p-4">

        <!-- Header -->
        <header class="bg-white shadow rounded-lg p-6 mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Stock Management Dashboard</h1>
            <div class="flex space-x-4">
                <button @click="currentTab = 'dashboard'"
                    :class="['px-4 py-2 rounded', currentTab === 'dashboard' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700']">
                    Dashboard
                </button>
                <button @click="currentTab = 'settings'"
                    :class="['px-4 py-2 rounded', currentTab === 'settings' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700']">
                    Settings
                </button>
            </div>
        </header>

        <!-- Dashboard Tab -->
        <div v-if="currentTab === 'dashboard'" class="space-y-6">
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">Charts (Plots)</h2>
                <div v-if="loadingCharts" class="text-gray-500">Loading charts...</div>
                <div v-else class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div v-for="chart in charts.plots" :key="chart" class="border rounded p-2">
                        <p class="text-sm font-medium mb-2 text-center text-gray-600">{{ chart }}</p>
                        <img :src="`/api/charts/image/plots/${chart}`" class="w-full h-auto rounded" loading="lazy">
                    </div>
                    <div v-if="charts.plots.length === 0" class="text-gray-500 italic">No charts found in data/plots
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">Charts (ChartImg)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div v-for="chart in charts.chartImg" :key="chart" class="border rounded p-2">
                        <p class="text-sm font-medium mb-2 text-center text-gray-600">{{ chart }}</p>
                        <img :src="`/api/charts/image/chartImg/${chart}`" class="w-full h-auto rounded" loading="lazy">
                    </div>
                    <div v-if="charts.chartImg.length === 0" class="text-gray-500 italic">No charts found in
                        data/chartImg</div>
                </div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div v-if="currentTab === 'settings'" class="max-w-4xl mx-auto">
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold">Trading Rules Configuration</h2>
                    <button @click="saveRules"
                        class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded shadow transition"
                        :disabled="saving">
                        {{ saving ? 'Saving...' : 'Save Changes' }}
                    </button>
                </div>

                <div v-if="loadingRules" class="text-gray-500">Loading rules...</div>

                <form v-else class="grid grid-cols-1 md:grid-cols-2 gap-6" @submit.prevent="saveRules">
                    <div v-for="(value, key) in rules" :key="key" class="border-b pb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1 capitalize">{{ formatKey(key)
                            }}</label>
                        <div class="flex items-center">
                            <input type="number" step="any" v-model.number="rules[key]"
                                class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <span class="ml-2 text-xs text-gray-500 font-mono">{{ key }}</span>
                        </div>
                    </div>
                </form>

                <div v-if="message"
                    :class="['mt-4 p-4 rounded', messageType === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700']">
                    {{ message }}
                </div>
            </div>
        </div>

    </div>
    {% endraw %}

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    currentTab: 'dashboard',
                    charts: { plots: [], chartImg: [] },
                    rules: {},
                    loadingCharts: false,
                    loadingRules: false,
                    saving: false,
                    message: '',
                    messageType: ''
                }
            },
            mounted() {
                this.fetchCharts()
                this.fetchRules()
            },
            methods: {
                formatKey(key) {
                    return key.replace(/_/g, ' ')
                },
                async fetchCharts() {
                    this.loadingCharts = true
                    try {
                        const res = await fetch('/api/charts/list')
                        this.charts = await res.json()
                    } catch (e) {
                        console.error(e)
                    } finally {
                        this.loadingCharts = false
                    }
                },
                async fetchRules() {
                    this.loadingRules = true
                    try {
                        const res = await fetch('/api/rules/')
                        this.rules = await res.json()
                    } catch (e) {
                        console.error(e)
                    } finally {
                        this.loadingRules = false
                    }
                },
                async saveRules() {
                    this.saving = true
                    this.message = ''
                    try {
                        const res = await fetch('/api/rules/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.rules)
                        })
                        if (!res.ok) throw new Error('Failed to save')
                        this.rules = await res.json()
                        this.message = 'Configuration saved successfully!'
                        this.messageType = 'success'
                        setTimeout(() => this.message = '', 3000)
                    } catch (e) {
                        this.message = 'Error saving rules: ' + e.message
                        this.messageType = 'error'
                    } finally {
                        this.saving = false
                    }
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
