<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor | Stock Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 表示件数の設定 (PRIDEV-493)。サーバ側 python/web/routes/system_monitor.py を単一の正とする -->
    <script>
        window.__MONITOR_CONFIG__ = {{ monitor_config | tojson }};
    </script>
    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    {% raw %}
    <div id="app" class="container mx-auto p-4">
        <header
            class="bg-white shadow rounded-lg p-4 sm:p-6 mb-6 flex flex-col gap-4 lg:flex-row lg:justify-between lg:items-center">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-800">System Monitor</h1>
                <p class="text-sm text-gray-500">最終更新: {{ checkedAtText }}</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button @click="reload" :disabled="loading"
                    class="px-4 py-2 rounded bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 disabled:opacity-50">
                    {{ loading ? '取得中...' : '再取得' }}
                </button>
                <form method="post" action="/auth/logout">
                    <button type="submit"
                        class="px-4 py-2 rounded bg-gray-200 text-gray-700 text-sm hover:bg-gray-300">ログアウト</button>
                </form>
            </div>
        </header>

        <!-- 状態: loading -->
        <div v-if="loading && !health" data-state="loading"
            class="bg-white p-6 rounded-lg shadow mb-6 flex items-center gap-3 text-gray-500">
            <svg class="w-4 h-4 animate-spin shrink-0" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            監視情報を取得しています…
        </div>

        <!-- 状態: 権限エラー / 取得失敗 -->
        <div v-else-if="errorMessage" data-state="error"
            class="bg-white p-6 rounded-lg shadow mb-6 border-l-4 border-red-400">
            <p class="font-semibold text-red-700">{{ errorMessage }}</p>
            <p class="text-sm text-gray-500 mt-1">内部の詳細情報は表示されません。</p>
            <button @click="reload"
                class="mt-3 px-4 py-2 rounded bg-red-600 text-white text-sm font-bold hover:bg-red-700">再試行</button>
        </div>

        <template v-else-if="health">
            <!-- 稼働状態 -->
            <section class="bg-white p-4 sm:p-6 rounded-lg shadow mb-6">
                <div class="flex flex-wrap items-center gap-3">
                    <span data-role="status-badge" class="px-3 py-1 rounded-full text-sm font-bold"
                        :class="statusBadgeClass">
                        {{ statusLabel }}
                    </span>
                    <span class="text-sm text-gray-500">エラー {{ health.error_count }} 件 / 警告 {{ health.warning_count }}
                        件</span>
                    <span v-if="health.last_success_at" class="text-sm text-gray-500">
                        最終正常実行: {{ formatTime(health.last_success_at) }}
                    </span>
                </div>

                <div v-if="health.degraded" data-state="degraded"
                    class="mt-4 p-3 rounded bg-amber-50 border border-amber-200 text-amber-800 text-sm">
                    <p class="font-semibold">監視情報の一部を取得できませんでした</p>
                    <ul class="list-disc list-inside mt-1">
                        <li v-for="reason in health.degraded_reasons" :key="reason">{{ reason }}</li>
                    </ul>
                </div>
            </section>

            <!-- 稼働指標 -->
            <section class="bg-white p-4 sm:p-6 rounded-lg shadow mb-6">
                <h2 class="text-lg font-semibold mb-3">稼働指標</h2>
                <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                    <div v-for="(sample, name) in health.metrics" :key="name" class="border rounded p-3">
                        <p class="text-xs text-gray-500">{{ name }}</p>
                        <p v-if="sample.available" class="text-lg font-mono">{{ formatMetric(sample.value) }}</p>
                        <p v-else class="text-sm text-gray-400">取得不可 <span class="text-xs">({{ sample.detail }})</span>
                        </p>
                    </div>
                    <p v-if="!metricCount" class="text-sm text-gray-400 italic">指標がありません。</p>
                </div>
            </section>

            <!-- 直近エラー -->
            <section class="bg-white p-4 sm:p-6 rounded-lg shadow">
                <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
                    <h2 class="text-lg font-semibold">直近のエラー</h2>
                    <span class="text-sm text-gray-500">
                        {{ visibleErrors.length }} / {{ totalErrorCount }} 件を表示
                    </span>
                </div>

                <p v-if="!totalErrorCount" data-state="empty" class="text-sm text-gray-400 italic">
                    直近のエラーはありません。
                </p>

                <div v-else class="table-scroll">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">発生時刻</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">severity</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">内容</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr v-for="(entry, index) in visibleErrors" :key="index">
                                <td class="px-3 py-2 whitespace-nowrap text-gray-500">{{ formatTime(entry.timestamp) }}
                                </td>
                                <td class="px-3 py-2 whitespace-nowrap">
                                    <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-800">
                                        {{ entry.severity }}
                                    </span>
                                </td>
                                <td class="px-3 py-2 break-all">{{ entry.message }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div v-if="canLoadMore" class="mt-4 text-center">
                    <button @click="loadMore" data-role="load-more"
                        class="px-4 py-2 rounded border border-gray-300 text-sm hover:bg-gray-50">
                        さらに読み込む ({{ config.loadMoreCount }} 件)
                    </button>
                </div>
                <p v-else-if="reachedDisplayCap" class="mt-4 text-center text-xs text-gray-400">
                    表示上限 {{ config.maxErrorCount }} 件に達しました。これ以上の調査は Cloud Logging をご確認ください。
                </p>
            </section>
        </template>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    // 表示件数はサーバ設定を単一の正とする (ここへ数値を直書きしないこと)
                    config: Object.assign(
                        { initialErrorCount: 20, enableLoadMore: true, loadMoreCount: 20, maxErrorCount: 100 },
                        window.__MONITOR_CONFIG__ || {}
                    ),
                    health: null,
                    loading: false,
                    errorMessage: '',
                    visibleCount: 0,
                }
            },
            computed: {
                totalErrorCount() {
                    return this.health ? Math.min(this.health.recent_errors.length, this.config.maxErrorCount) : 0
                },
                visibleErrors() {
                    if (!this.health) return []
                    return this.health.recent_errors.slice(0, Math.min(this.visibleCount, this.config.maxErrorCount))
                },
                canLoadMore() {
                    return this.config.enableLoadMore && this.visibleErrors.length < this.totalErrorCount
                },
                reachedDisplayCap() {
                    return this.health && this.health.recent_errors.length > this.config.maxErrorCount
                },
                metricCount() {
                    return this.health ? Object.keys(this.health.metrics).length : 0
                },
                statusLabel() {
                    return {
                        ok: '正常',
                        warning: '警告',
                        error: 'エラー',
                        degraded: '一部取得不可',
                    }[this.health && this.health.status] || '不明'
                },
                statusBadgeClass() {
                    return {
                        ok: 'bg-green-100 text-green-800',
                        warning: 'bg-yellow-100 text-yellow-800',
                        error: 'bg-red-100 text-red-800',
                        degraded: 'bg-amber-100 text-amber-800',
                    }[this.health && this.health.status] || 'bg-gray-100 text-gray-800'
                },
                checkedAtText() {
                    return this.health ? this.formatTime(this.health.checked_at) : '-'
                },
            },
            methods: {
                formatTime(value) {
                    if (!value) return '-'
                    const parsed = new Date(value)
                    return isNaN(parsed.getTime()) ? value : parsed.toLocaleString('ja-JP')
                },
                formatMetric(value) {
                    if (value === null || value === undefined) return '-'
                    return Number(value).toFixed(3)
                },
                async fetchHealth() {
                    this.loading = true
                    this.errorMessage = ''
                    try {
                        const res = await fetch('/api/system-monitor', {
                            headers: { Accept: 'application/json' },
                        })
                        if (res.status === 401) {
                            this.errorMessage = 'セッションが切れました。再度ログインしてください。'
                            return
                        }
                        if (res.status === 403) {
                            this.errorMessage = '監視情報を参照する権限がありません。'
                            return
                        }
                        if (!res.ok) {
                            this.errorMessage = '監視情報を取得できませんでした。'
                            return
                        }
                        this.health = await res.json()
                        this.visibleCount = this.config.initialErrorCount
                    } catch (e) {
                        // 内部エラーの詳細は画面へ出さない
                        console.error(e)
                        this.errorMessage = '監視情報を取得できませんでした。'
                    } finally {
                        this.loading = false
                    }
                },
                loadMore() {
                    this.visibleCount = Math.min(
                        this.visibleCount + this.config.loadMoreCount,
                        this.config.maxErrorCount
                    )
                },
                reload() {
                    this.fetchHealth()
                },
            },
            mounted() {
                this.fetchHealth()
            },
        }).mount('#app')
    </script>
    {% endraw %}
</body>

</html>
