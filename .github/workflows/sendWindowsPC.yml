name: Release main to runProjectByWindows

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # すべての履歴を取得（マージに必要）

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch origin

      - name: Checkout runProjectByWindows branch
        run: |
          git checkout runProjectByWindows || git checkout -b runProjectByWindows
          git merge origin/main --no-edit

    - name: Push changes
      run: git push origin runProjectByWindows
      env:
        GIT_TOKEN: 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
        # Change the remote URL to use the token
      run: |
        git remote set-url origin https://x-access-token:${GIT_TOKEN}@github.com/NK28116/stockManegement.git
        git push origin runProjectByWindows
