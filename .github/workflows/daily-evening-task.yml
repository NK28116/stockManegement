name: Daily Evening Task (Market Close)

on:
  schedule:
    - cron: '30 6 * * *' # UTC 6:30 = JST 15:30 (市場終了直後)

jobs:
  run_evening_tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # プロジェクトのPythonバージョンに合わせて調整
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily analysis for crash detection and signals
        run: python -m python.watch.analyze > signal_codes.json
      - name: Get signal codes
        id: get_signals
        run: |
          SIGNAL_CODES=$(jq -r '.[]' signal_codes.json | tr '\n' ' ') # スペース区切りの文字列にする
          echo "SIGNAL_CODES=$SIGNAL_CODES" >> $GITHUB_ENV
      - name: Generate charts for signal stocks (1 month period)
        if: env.SIGNAL_CODES != '' # シグナルが出た銘柄がある場合のみ実行
        run: python -m python.visualization.generate_all_charts 1mo ${{ env.SIGNAL_CODES }}
