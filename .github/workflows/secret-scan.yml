# シークレット混入を CI で検知する (PRIDEV-114)
# 全履歴をスキャンするため、履歴浄化 (PRIDEV-113) が完了するまでは
# 過去コミットの検出で fail する。浄化完了後にグリーンになることが
# PRIDEV-309 (浄化結果の検証) の DoD を兼ねる。
name: Secret Scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
