name: Scheduled Stock Analysis

on:
  schedule:
    # UTC時間で毎日午前2時30分に実行
    # cron式の詳細: https://docs.github.com/ja/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '30 2 * * *'
  workflow_dispatch: # 手動実行を可能にする

jobs:
  run_analysis:
    runs-on: ubuntu-latest # 実行環境 (Linux)

    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4

    - name: Python環境をセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # 使用するPythonのバージョンを指定

    - name: 依存関係をインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      # matplotlibのような大きなライブラリはビルドに時間がかかる場合があります。
      # 必要に応じて、ビルドツール（例: apt-get install build-essential）のインストールステップを追加することも検討してください。

    - name: スクリプトを実行
      run: |
        # lambda_function.py を直接実行する場合
        # python lambda_function.py
        # python/watch/watch.py を実行する場合
        python3 -m python.watch.watch
        # または、lambda_function.py の lambda_handler 関数を呼び出す場合
        # python -c "from lambda_function import lambda_handler; lambda_handler({}, {})"
      # スクリプトの実行方法に合わせて調整してください。

    # オプション: AWSサービスとの連携
    # - name: AWS認証情報を設定
    #   uses: aws-actions/configure-aws-credentials@v4
    #   with:
    #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #     aws-region: ap-northeast-1 # 使用するAWSリージョンを指定

    # - name: S3に結果をアップロード (例)
    #   run: |
    #     aws s3 cp ./data/chartImg/ s3://your-s3-bucket/charts/ --recursive
    #   # AWS CLIコマンドは、AWS認証情報設定ステップの後で実行できます。
