name: Scheduled Stock Analysis

on:
  schedule:
    # UTC時間で毎日午前2時30分に実行
    # cron式の詳細: https://docs.github.com/ja/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '*/2 0-6 * * *' # UTC 0:00-6:00 (JST 9:00-15:00) の間、2分ごとに実行
  workflow_dispatch: # 手動実行を可能にする

jobs:
  run_analysis:
    runs-on: ubuntu-latest # 実行環境 (Linux)

    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4

    - name: Python環境をセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # 使用するPythonのバージョンを指定
        cache: 'pip' # pipキャッシュを有効にする
        cache-dependency-path: 'requirements.txt' # requirements.txtをキャッシュのキーとして使用

    - name: 依存関係をインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      # matplotlibのような大きなライブラリはビルドに時間がかかる場合があります。
      # 必要に応じて、ビルドツール（例: apt-get install build-essential）のインストールステップを追加することも検討してください。

    - name: Run daily analysis to get filtered stocks
      run: python -m python.watch.analyze > filtered_codes.json
    - name: Get filtered codes
      id: get_filtered_codes
      run: |
        FILTERED_CODES=$(jq -r '.[]' filtered_codes.json | tr '\n' ' ') # スペース区切りの文字列にする
        echo "FILTERED_CODES=$FILTERED_CODES" >> $GITHUB_ENV
    - name: Get current UTC hour
      id: get_utc_hour
      run: echo "CURRENT_UTC_HOUR=$(date -u +%H)" >> $GITHUB_ENV
    - name: Run watch script for filtered stocks (once)
      if: env.FILTERED_CODES != '' && (env.CURRENT_UTC_HOUR >= '00' && env.CURRENT_UTC_HOUR < '06') # UTC 0:00-6:00 (JST 9:00-15:00) の間のみ実行
      run: python3 -m python.watch.watch --once ${{ env.FILTERED_CODES }}

