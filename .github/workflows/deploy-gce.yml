name: Deploy to GCE

# main への push で、GCE 上のリポジトリを更新する (git pull → pip install)。
# GCE の SSH (22 番) はインターネットに開いていないため、Workload Identity でログインし、
# IAP トンネル経由の SSH で scripts/deploy_gce.sh を実行する。設定手順: Docs/DEPLOY_GCE.md

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

# デプロイが重ならないようにする (後から来たものは前のものの完了を待つ)
concurrency:
    group: deploy-gce
    cancel-in-progress: false

jobs:
    deploy-gce:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCE_DEPLOY_SERVICE_ACCOUNT }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2

            - name: Deploy to GCE via IAP
              env:
                  GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
                  GCE_ZONE: ${{ secrets.GCE_ZONE }}
                  APP_USER: ${{ secrets.GCE_USERNAME }}
                  PROJECT_ID: ${{ steps.auth.outputs.project_id }}
              run: |
                  set -euo pipefail
                  for v in GCE_INSTANCE GCE_ZONE APP_USER PROJECT_ID; do
                      if [ -z "${!v}" ]; then
                          echo "::error::$v が空です。Secrets の設定を確認してください (Docs/DEPLOY_GCE.md)。"
                          exit 1
                      fi
                  done
                  # デプロイ用 SA で OS Login し、リポジトリの持ち主として deploy_gce.sh を実行する
                  gcloud compute ssh "$GCE_INSTANCE" \
                      --project "$PROJECT_ID" --zone "$GCE_ZONE" \
                      --tunnel-through-iap --quiet \
                      --strict-host-key-checking=no \
                      --command "sudo -u '$APP_USER' -H bash -s -- '/home/$APP_USER/stockManegement'" \
                      < scripts/deploy_gce.sh
