# This workflow build and push a Docker container to Google Container Registry
# and deploy it on Cloud Run when a commit is pushed to the "main" branch.

name: "Build and Deploy to Cloud Run"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches: ["main"]

env:
  REGION: "us-east1"
  SERVICE: "stock-web-ui"

jobs:
  deploy:
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      # Configure Workload Identity Federation via google-github-actions/auth.
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"
          token_format: 'access_token' 

      # Authenticate Docker to GCR using the GCLOUD credential helper or oauth token
      - name: "Docker Auth"
        uses: "docker/login-action@v3"
        with:
          registry: "gcr.io"
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.auth_token }}"

      - name: "Build and Push Container"
        run: |-
          DOCKER_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build --tag "${DOCKER_TAG}" .
          docker push "${DOCKER_TAG}"

      - name: "Deploy to Cloud Run"
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: "${{ env.SERVICE }}"
          region: "${{ env.REGION }}"
          image: "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}"
          env_vars: |
            GCS_BUCKET_NAME=stock-management-prod
          flags: "--allow-unauthenticated"

      - name: "Show output"
        run: echo ${{ steps.deploy.outputs.url }}
